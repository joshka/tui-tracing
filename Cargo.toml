[package]
name = "tui-tracing"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
description = "Runtime tracing viewer primitives for Ratatui applications"
repository = "https://github.com/joshka/tui-tracing"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ratatui", "tracing", "tui", "logging"]
categories = ["command-line-interface", "development-tools::debugging"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chrono = "0.4"
indexmap = "2.7"
itertools = "0.14"
parking_lot = "0.12"
quanta = "0.12"
ratatui = { version = "0.30", default-features = false }
tracing = "0.1.12"
tracing-subscriber = "0.3"

[dev-dependencies]
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
rand = "0.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tokio = { version = "1.21", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
tokio-util = "0.7"
tracing-appender = "0.2"
