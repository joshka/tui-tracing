[package]
name = "tui-tracing"
version = "0.1.0"
edition = "2021"
description = "Runtime tracing viewer primitives for Ratatui applications"
repository = "https://github.com/joshka/tui-tracing"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4.38"
indexmap = "2.4.0"
itertools = "0.14.0"
parking_lot = "0.12.3"
quanta = "0.12.3"
ratatui = "0.30.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.20"

[dev-dependencies]
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.30"
rand = "0.8.6"
tokio = { version = "1.39.2", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
tokio-util = "0.7.11"
tracing-appender = "0.2.3"
